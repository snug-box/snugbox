# An hour of fuzzing every night, shared out over every fuzz target
# (blueprint section 9.2), and every supported distribution booted in a
# virtual machine with a reboot in the middle of a fix (sections 9.7 and
# 16.2). Pull requests fuzz each target for 30 seconds in ci.yml; this goes
# deeper. A failing input is kept for the fix.
name: nightly

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # On a private repository an hour a night would use most of the Actions
  # minutes a free plan includes, so the schedule runs it only when the
  # repository is public; it can still be started by hand. A scheduled run
  # carries no repository in its event, so this asks.
  public:
    name: Is the repository public
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')" >>"$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz for an hour
    needs: public
    if: needs.public.outputs.public == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every fuzz target, sixty minutes between them
        run: sh test/fuzz.sh
        env:
          FUZZ_MINUTES: "60"
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: agent/**/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30

  vm:
    name: Every distribution in a virtual machine, with a reboot
    needs: public
    if: needs.public.outputs.public == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The machines get packages built here; a cache another workflow
          # wrote must not reach them.
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          install-only: true
      - name: KVM for the runner's user, QEMU and cloud-localds
        # GitHub's Linux runners have /dev/kvm, readable by root only until
        # this udev rule opens it.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Build the release and run it on every distribution
        run: |
          sh test/vm/prepare.sh "$RUNNER_TEMP/vm"
          sh test/vm/host.sh "$RUNNER_TEMP/vm"
