# Builds, signs and drafts a release when a signed tag such as v0.4.0 is
# pushed. Every file is signed with cosign through this workflow's OIDC
# identity, gets a GitHub artifact attestation, and is covered by SLSA
# provenance from slsa-github-generator. Then the draft is downloaded and
# checked the way SECURITY.md tells a user to, every file, before a person
# reads its notes and publishes it (blueprint sections 6.3, 9.6 and 16.1).
# While the repository is private the attestation and the SLSA provenance
# are left out, since GitHub offers neither to a private repository on a
# personal plan.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # create the draft release and upload its files
      id-token: write # sign with cosign and attest, without a stored key
      attestations: write # store the artifact attestations
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is signed, annotated and on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          read -r kind object <<EOF
          $(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          EOF
          if [ "$kind" != tag ]; then
            echo "::error::$TAG is a lightweight tag; releases come from signed, annotated tags"
            exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq .verification.verified)
          if [ "$verified" != true ]; then
            echo "::error::$TAG is not signed by a key GitHub can verify"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache in a release: a cache written by another workflow must
          # not reach what is shipped.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Build, sign and draft the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          # One worker keeps the order of files in each archive fixed; see
          # the top of .goreleaser.yaml.
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest the provenance of every file in checksums.txt
        # Artifact attestations need a public repository, or GitHub
        # Enterprise for a private one.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Hashes for the SLSA provenance
        id: hashes
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >>"$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: release
    # The generator refuses a private repository unless told to publish its
    # name to the public transparency log, which this doesn't do.
    if: ${{ !github.event.repository.private }}
    permissions:
      actions: read # the generator reads this run to describe the build
      id-token: write # sign the provenance through Sigstore
      contents: write # attach the provenance to the draft release
    # slsa-github-generator must be called by its version tag: it checks its
    # own identity from that tag and fails when called by commit. This is
    # the one reference here that is not a commit hash.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      draft-release: "true"

  verify:
    name: Check the draft as a user would
    needs: [release, provenance]
    # The provenance job is skipped while the repository is private, and
    # the draft is still checked then.
    if: ${{ always() && needs.release.result == 'success' && (needs.provenance.result == 'success' || needs.provenance.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # a draft release is visible only to a token that can write the repository
      attestations: read # gh attestation verify reads the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: slsa-verifier, pinned by SHA-256
        if: ${{ !github.event.repository.private }}
        env:
          SLSA_VERIFIER_VERSION: v2.7.1
          SLSA_VERIFIER_SHA256: 946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/slsa-verifier" \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/$SLSA_VERIFIER_VERSION/slsa-verifier-linux-amd64"
          echo "$SLSA_VERIFIER_SHA256  $RUNNER_TEMP/slsa-verifier" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/slsa-verifier"
      - name: Download every file of the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
      - name: Every file's checksum, signature, bills of materials, provenance and attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -- "$RUNNER_TEMP/release" "$TAG"
          if [ "$PRIVATE" != true ]; then
            set -- --provenance --attestations "$@"
          fi
          SLSA_VERIFIER="$RUNNER_TEMP/slsa-verifier" sh test/release/verify.sh "$@"
